<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公文 OCR · 图片转 Word</title>
<style>
  :root{
    --ink:#1c1033;
    --muted:#6f6488;
    --panel:rgba(255,255,255,.86);
    --line:rgba(124,58,237,.16);
    --accent:#ff2e88;
    --accent-2:#ff7a18;
    --accent-3:#7c3aed;
    --ok:#068a68;
    --warn:#a86a00;
    --bad:#d92a63;
    --radius:16px;
    --shadow-soft:0 22px 55px -32px rgba(76,29,149,.55);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 520px at 6% -8%, rgba(255,46,136,.42), transparent 62%),
      radial-gradient(760px 480px at 98% 2%, rgba(0,194,255,.36), transparent 60%),
      radial-gradient(720px 520px at 96% 96%, rgba(124,58,237,.30), transparent 62%),
      radial-gradient(820px 620px at 52% 108%, rgba(255,210,0,.38), transparent 62%),
      linear-gradient(160deg,#fff7fc 0%,#f4f7ff 52%,#fffaf2 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    font-size:14px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#ffd3e6;color:#3a1140}
  .topbar{
    position:relative;
    overflow:hidden;
    background:linear-gradient(115deg,#ff1f6b 0%,#c2189b 52%,#6d28d9 100%);
    box-shadow:0 14px 34px -18px rgba(139,47,242,.6);
    padding:20px 32px;
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:6px 16px;
    color:#fff;
  }
  .topbar::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(520px 190px at 78% -25%,rgba(255,255,255,.42),transparent 70%);
  }
  .topbar h1{
    position:relative;z-index:1;
    margin:0;
    font-size:18px;
    font-weight:700;
    letter-spacing:.6px;
  }
  .topbar h1 span{color:#ffe14d}
  .topbar p{
    position:relative;z-index:1;
    margin:0;color:rgba(255,255,255,.94);font-size:13px;font-weight:500;
    text-shadow:0 1px 3px rgba(60,0,60,.28);
  }

  main{
    max-width:1280px;margin:0 auto;padding:30px 28px 70px;
    display:flex;flex-direction:column;
    min-height:calc(100vh - 97px);
  }

  /* ---------- 上传区 ---------- */
  #drop{
    background:
      radial-gradient(360px 190px at 12% 6%, rgba(255,46,136,.22), transparent 70%),
      radial-gradient(380px 210px at 90% 94%, rgba(0,194,255,.24), transparent 70%),
      radial-gradient(300px 170px at 82% 6%, rgba(124,58,237,.16), transparent 70%),
      linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.80));
    border:2px dashed rgba(255,46,136,.55);
    border-radius:26px;
    padding:70px 24px;
    margin:auto 0;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--shadow-soft),inset 0 1px 0 rgba(255,255,255,.95);
    backdrop-filter:blur(10px);
    transition:border-color .2s,box-shadow .2s,transform .2s;
  }
  #drop:hover,#drop.over{
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 32px 64px -30px rgba(255,46,136,.55),inset 0 1px 0 rgba(255,255,255,.95);
  }
  #drop svg{
    width:72px;height:72px;padding:14px;border-radius:50%;
    stroke:#fff;
    background:linear-gradient(135deg,#ff2e88,#7c3aed);
    box-shadow:0 16px 32px -12px rgba(255,46,136,.6);
  }
  #drop h2{margin:18px 0 8px;font-size:17px;font-weight:700;letter-spacing:.3px}
  #drop p{margin:0;color:var(--muted);font-size:12.5px}
  #drop .hint{
    display:inline-block;margin-top:20px;padding:6px 16px;
    border-radius:999px;font-size:12px;font-weight:600;color:#6b46c1;
    background:linear-gradient(120deg,rgba(124,58,237,.10),rgba(0,194,255,.12));
  }

  /* ---------- 工作区 ---------- */
  #workspace{display:grid;grid-template-columns:minmax(280px,36%) 1fr;gap:24px;align-items:start}
  @media (max-width:980px){
    #workspace{grid-template-columns:1fr}
    .preview{position:static}
  }

  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,251,255,.84));
    border:1px solid rgba(124,58,237,.14);
    border-radius:20px;
    box-shadow:0 22px 46px -34px rgba(76,29,149,.55);
    backdrop-filter:blur(14px);
  }
  .preview{position:sticky;top:20px;padding:14px}
  #thumbs img{
    display:block;width:100%;padding:5px;border-radius:12px;margin-bottom:10px;
    background:linear-gradient(135deg,#ff2e88,#ffb020 45%,#7c3aed);
    box-shadow:0 12px 26px -18px rgba(76,29,149,.6);
  }
  .preview .meta{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 6px 4px;color:var(--muted);font-size:12px;
  }
  #filename{font-weight:600;color:#3b2a66}

  .editor{display:flex;flex-direction:column;gap:14px}

  .toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    padding:14px 16px;
    background:linear-gradient(120deg,rgba(255,46,136,.08),rgba(255,210,0,.10) 38%,rgba(0,194,255,.10) 72%,rgba(124,58,237,.10));
  }
  .toolbar .grow{flex:1}
  .field{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
  select,input,textarea{font-family:inherit;color:inherit}
  .field select{
    border:1px solid rgba(124,58,237,.22);border-radius:999px;background:#fff;
    padding:5px 10px;font-size:12.5px;font-weight:600;color:#4b2a86;
    outline:none;cursor:pointer;transition:.15s;
  }
  .field select:hover{border-color:rgba(255,46,136,.45)}
  .field select:focus{
    border-color:var(--accent-3);
    box-shadow:0 0 0 3px rgba(124,58,237,.15);
  }

  button{
    font-family:inherit;cursor:pointer;border-radius:999px;
    transition:.18s;font-size:13px;font-weight:600;
  }
  .btn{
    border:1px solid rgba(124,58,237,.22);background:#fff;color:#4b2a86;
    padding:8px 16px;
  }
  .btn:hover{
    border-color:var(--accent);color:var(--accent);
    box-shadow:0 10px 22px -14px rgba(255,46,136,.6);
    transform:translateY(-1px);
  }
  .btn.primary{
    background:linear-gradient(135deg,#ff2e88 0%,#ff7a18 55%,#ffb020 100%);
    border:1px solid transparent;color:#fff;
    padding:10px 26px;font-weight:700;letter-spacing:.4px;
    box-shadow:0 14px 28px -12px rgba(255,46,136,.75);
  }
  .btn.primary:hover{
    color:#fff;
    filter:saturate(1.12);
    box-shadow:0 18px 34px -12px rgba(255,46,136,.85);
    transform:translateY(-1px);
  }
  .btn.primary:disabled{opacity:.55;cursor:default;filter:none;transform:none;box-shadow:none}
  .ghost{
    border:none;background:transparent;color:#9a8db3;
    font-size:12px;padding:2px 8px;
  }
  .ghost:hover{color:var(--accent)}

  /* ---------- 段落卡片 ---------- */
  .block{
    background:#fff;
    background:linear-gradient(100deg,color-mix(in srgb,var(--role,#c9c4b8) 7%,#fff) 0%,#fff 42%);
    border:1px solid rgba(124,58,237,.12);
    border-left:4px solid var(--role,#c9c4b8);
    border-radius:14px;
    padding:10px 14px 12px;
    transition:border-color .18s,box-shadow .18s;
    animation:rise .28s ease both;
  }
  .block:focus-within{
    border-color:color-mix(in srgb,var(--role,#7c3aed) 45%,#fff);
    box-shadow:
      0 0 0 4px color-mix(in srgb,var(--role,#7c3aed) 14%,transparent),
      0 14px 30px -22px rgba(29,18,48,.5);
  }
  .block-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .block-top select{
    appearance:none;-webkit-appearance:none;
    border:none;background:transparent;
    font-size:12px;font-weight:700;color:var(--role);
    padding:2px 18px 2px 0;
    cursor:pointer;outline:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='6'><path d='M0 0l4 5 4-5z' fill='%23a4a9b0'/></svg>");
    background-repeat:no-repeat;
    background-position:right 2px center;
  }
  .conf{
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;
    background:linear-gradient(135deg,rgba(0,212,160,.18),rgba(0,194,255,.18));
    color:var(--ok);
    font-variant-numeric:tabular-nums;
  }
  .conf.mid{
    background:linear-gradient(135deg,rgba(255,176,32,.20),rgba(255,210,0,.20));
    color:var(--warn);
  }
  .conf.low{
    background:linear-gradient(135deg,rgba(255,46,136,.16),rgba(255,122,24,.16));
    color:var(--bad);
  }
  .block textarea{
    display:block;width:100%;border:none;outline:none;background:transparent;
    resize:none;overflow:hidden;color:var(--ink);
    font-family:"FangSong","仿宋","STFangsong",serif;
    font-size:16px;line-height:1.8;
    padding:2px 0;
  }
  .block textarea::placeholder{color:#bdb3d1}
  .block[data-role="title"] textarea{
    font-family:"SimHei","黑体",sans-serif;font-size:19px;font-weight:600;
    text-align:center;
  }
  .block[data-role="docorg"] textarea{
    font-family:"SimHei","黑体",sans-serif;font-size:22px;font-weight:600;
    text-align:center;color:#d81b7a;
  }
  .block[data-role="heading1"] textarea{font-family:"SimHei","黑体",sans-serif;font-weight:600}
  .block[data-role="heading2"] textarea{font-family:"KaiTi","楷体",serif}
  .block[data-role="signature"] textarea,
  .block[data-role="date"] textarea{text-align:right}
  .block[data-role="pagebreak"]{
    background:linear-gradient(120deg,rgba(124,58,237,.12),rgba(0,194,255,.10) 50%,rgba(255,210,0,.12));
    border-style:dashed;border-color:rgba(124,58,237,.32);
    border-left-width:4px;padding:6px 14px;
  }
  .block[data-role="pagebreak"] .block-top{margin:0}

  /* ---------- 状态 ---------- */
  #busy{
    position:fixed;inset:0;background:rgba(251,246,255,.78);
    backdrop-filter:blur(6px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;z-index:50;
  }
  #busy .ring{
    width:50px;height:50px;border-radius:50%;
    background:conic-gradient(from 0deg,#ff2e88,#ff7a18,#ffd200,#00d4a0,#7c3aed,#ff2e88);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #busy p{margin:0;color:#5b4a7a;font-weight:600;font-size:13px}

  #toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(12px);
    background:linear-gradient(135deg,#2b1240,#5b21a8);color:#fff;
    padding:10px 22px;border-radius:999px;
    font-size:13px;font-weight:600;
    box-shadow:0 18px 40px -18px rgba(76,29,149,.85);
    opacity:0;pointer-events:none;transition:.22s;z-index:60;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty{
    text-align:center;color:var(--muted);font-size:12.5px;
    padding:34px 0;
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>公文 OCR <span>·</span> 图片 / PDF 转 Word</h1>
  <p>上传 JPG、PNG（可多选，最多 10 张）或 PDF 扫描件，自动识别并合成一份公文格式（仿宋三号 · 黑体标题）</p>
</div>

<main>
  <section id="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V4m0 0L7 9m5-5l5 5"/>
      <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
    </svg>
    <h2>拖拽图片（可多选）或 PDF 到这里，或点击选择文件</h2>
    <p>JPG、PNG 最多 10 张，会自动合成一份 Word；PDF 单独上传，总大小不超过 50MB</p>
    <div class="hint">也可以直接按 Ctrl+V 粘贴截图</div>
    <input id="file" type="file" accept="image/jpeg,image/png,application/pdf,.pdf" multiple hidden>
  </section>

  <section id="workspace" hidden>
    <aside class="card preview">
      <div id="thumbs"></div>
      <div class="meta">
        <span id="filename">—</span>
        <button class="ghost" id="reset">换一份</button>
      </div>
    </aside>

    <div class="editor">
      <div class="card toolbar">
        <div class="field">
          正文
          <select id="bodyFont">
            <option value="仿宋">仿宋</option>
            <option value="仿宋_GB2312">仿宋_GB2312</option>
            <option value="华文仿宋">华文仿宋</option>
          </select>
        </div>
        <div class="field">
          标题
          <select id="titleFont">
            <option value="黑体">黑体</option>
            <option value="方正小标宋简体">方正小标宋简体</option>
            <option value="宋体">宋体</option>
          </select>
        </div>
        <div class="grow"></div>
        <button class="btn" id="add">＋ 新增段落</button>
        <button class="btn primary" id="generate">生成 Word</button>
      </div>
      <div id="blocks" class="editor"></div>
    </div>
  </section>
</main>

<div id="busy" hidden><div class="ring"></div><p id="busyText">正在识别文字…</p></div>
<div id="toast"></div>

<script>
const META = {
  title:     ['标题',        '#ff2d6f'],
  docorg:    ['发文机关标志', '#e0008a'],
  recipient: ['主送机关',     '#f08a00'],
  heading1:  ['一级标题 一、', '#ff6a00'],
  heading2:  ['二级标题 （一）','#8b2ff2'],
  heading3:  ['三级标题 1.',  '#0b8cf0'],
  body:      ['正文',        '#8d87a6'],
  signature: ['发文机关署名', '#06a37c'],
  date:      ['成文日期',     '#06a37c'],
  blank:     ['空行',        '#cfc9de'],
  pagebreak: ['分页符',      '#8b2ff2'],
};

const $ = s => document.querySelector(s);
const drop = $('#drop');
const workspace = $('#workspace');
const listEl = $('#blocks');
const state = { blocks: [], thumbUrls: [], busy: false };

/* ---------- 工具 ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function busy(on, text){
  state.busy = on;
  $('#busyText').textContent = text || '正在识别文字…';
  $('#busy').hidden = !on;
  $('#generate').disabled = on;
}

function autosize(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function options(selected){
  return Object.entries(META)
    .map(([k, [label]]) => `<option value="${k}"${k === selected ? ' selected' : ''}>${label}</option>`)
    .join('');
}

/* ---------- 渲染 ---------- */
function card(b, i){
  const color = (META[b.role] || META.body)[1];
  let conf = '';
  if (typeof b.score === 'number' && b.role !== 'pagebreak'){
    const pct = Math.round(b.score * 100);
    const cls = b.score >= .9 ? '' : b.score >= .75 ? ' mid' : ' low';
    conf = `<span class="conf${cls}" title="识别置信度">${pct}%</span>`;
  }
  const head = `<div class="block-top">
      <select class="role" aria-label="段落类型">${options(b.role)}</select>
      ${conf}
      <span style="flex:1"></span>
      <button class="ghost del" title="删除此段">删除</button>
    </div>`;
  const body = b.role === 'pagebreak'
    ? ''
    : `<textarea rows="1" placeholder="输入文字…">${esc(b.text)}</textarea>`;
  return `<article class="block" data-i="${i}" data-role="${b.role}" style="--role:${color}">
    ${head}${body}
  </article>`;
}

function render(){
  listEl.innerHTML = state.blocks.length
    ? state.blocks.map(card).join('')
    : '<div class="empty">还没有内容，点击「新增段落」开始编辑</div>';
  listEl.querySelectorAll('textarea').forEach(autosize);
}

/* ---------- 上传与识别 ---------- */
const isPdf = file => file.type === 'application/pdf' || /\.pdf$/i.test(file.name);

function setThumbs(srcs){
  $('#thumbs').innerHTML = srcs
    .map(src => `<img src="${src}" alt="页面预览">`)
    .join('');
}

function clearThumbs(){
  state.thumbUrls.forEach(u => URL.revokeObjectURL(u));
  state.thumbUrls = [];
  $('#thumbs').innerHTML = '';
}

const MAX_FILES = 10;

async function handleFiles(list){
  const files = [...list];
  if (!files.length || state.busy) return;

  const pdfs = files.filter(isPdf);
  if (files.length > MAX_FILES){
    toast(`一次最多上传 ${MAX_FILES} 张图片`);
    return;
  }
  if (pdfs.length && files.length > 1){
    toast('PDF 请单独上传，图片可以多选');
    return;
  }
  if (!pdfs.length && files.some(f => !/^image\/(jpeg|png)$/.test(f.type))){
    toast('请上传 JPG、PNG 或 PDF 文件');
    return;
  }
  if (files.reduce((s, f) => s + f.size, 0) > 50 * 1024 * 1024){
    toast('文件总大小超过 50MB，请压缩后再试');
    return;
  }

  const pdf = pdfs.length === 1;
  clearThumbs();
  if (!pdf){
    state.thumbUrls = files.map(f => URL.createObjectURL(f));
    setThumbs(state.thumbUrls);
  }
  $('#filename').textContent = pdf
    ? files[0].name
    : files.length === 1 ? files[0].name : `${files.length} 张图片`;

  busy(true, pdf ? '正在解析 PDF，逐页识别中…'
    : files.length > 1 ? `正在依次识别 ${files.length} 张图片…` : '正在识别文字…');
  try{
    const fd = new FormData();
    files.forEach(f => fd.append('files', f));
    const res = await fetch('/api/ocr', { method: 'POST', body: fd });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || '识别失败');

    state.blocks = data.blocks || [];
    if (!state.blocks.length) throw new Error('未识别到文字，请换更清晰的文件');

    if (pdf){
      setThumbs(data.previews || []);
      $('#filename').textContent = `${
        files[0].name} · 共 ${data.pages} 页${data.previews?.length < data.pages ? '（仅显示前几页）' : ''}`;
    }else if (files.length > 1){
      $('#filename').textContent = `${files[0].name} 等 ${files.length} 张 · 共 ${data.pages} 页`;
    }

    drop.hidden = true;
    workspace.hidden = false;
    render();
  }catch(err){
    clearThumbs();
    toast(err.message || '识别失败');
  }finally{
    busy(false);
  }
}

drop.addEventListener('click', () => $('#file').click());
$('#file').addEventListener('click', e => e.stopPropagation());
$('#file').addEventListener('change', e => {
  handleFiles(e.target.files);
  e.target.value = '';
});

['dragenter', 'dragover'].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); })
);
['dragleave', 'drop'].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); })
);
drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) handleFiles(files);
});

/* ---------- 编辑 ---------- */
listEl.addEventListener('input', e => {
  if (e.target.tagName !== 'TEXTAREA') return;
  const i = +e.target.closest('.block').dataset.i;
  state.blocks[i].text = e.target.value;
  autosize(e.target);
});

listEl.addEventListener('change', e => {
  if (!e.target.classList.contains('role')) return;
  const i = +e.target.closest('.block').dataset.i;
  state.blocks[i].role = e.target.value;
  render();
});

listEl.addEventListener('click', e => {
  if (!e.target.classList.contains('del')) return;
  const i = +e.target.closest('.block').dataset.i;
  state.blocks.splice(i, 1);
  render();
});

$('#add').addEventListener('click', () => {
  state.blocks.push({ role: 'body', text: '' });
  render();
  const areas = listEl.querySelectorAll('textarea');
  areas[areas.length - 1]?.focus();
});

$('#reset').addEventListener('click', () => {
  clearThumbs();
  state.blocks = [];
  workspace.hidden = true;
  drop.hidden = false;
});

/* ---------- 导出 ---------- */
$('#generate').addEventListener('click', async () => {
  const blocks = state.blocks
    .filter(b => b.role === 'blank' || b.role === 'pagebreak' || b.text.trim())
    .map(b => ({ role: b.role, text: b.text.trim() }));
  if (!blocks.length){
    toast('没有可导出的内容');
    return;
  }

  busy(true, '正在生成 Word…');
  try{
    const res = await fetch('/api/docx', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        blocks,
        body_font: $('#bodyFont').value,
        title_font: $('#titleFont').value,
      }),
    });
    if (!res.ok){
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || '生成失败');
    }

    const blob = await res.blob();
    const cd = res.headers.get('Content-Disposition') || '';
    const m = /filename\*=UTF-8''([^;]+)/i.exec(cd);
    const name = m ? decodeURIComponent(m[1]) : '公文.docx';

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('已生成：' + name);
  }catch(err){
    toast(err.message || '生成失败');
  }finally{
    busy(false);
  }
});
</script>
</body>
</html>

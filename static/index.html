<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>公文 OCR · 图片转 Word</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('theme');
    if (!saved) saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = saved;
  } catch (e) {}
})();
</script>
<style>
  :root{
    color-scheme:light;
    --bg:#f7f9fb;
    --surface:#ffffff;
    --surface-2:#f3f6fa;
    --surface-3:#e9eff6;
    --text:#1b2733;
    --muted:#69788a;
    --faint:#9aa8b6;
    --border:#e2e9f1;
    --border-strong:#cbd7e4;
    --accent:#2b7cf0;
    --accent-hover:#1e66d0;
    --accent-soft:rgba(43,124,240,.10);
    --ok:#0f8a6a;
    --warn:#a8720a;
    --bad:#cf3d5e;
    --overlay:rgba(247,249,251,.80);
    --toast-bg:#1c2733;
    --toast-text:#ffffff;
    --radius:14px;
    --shadow-card:0 1px 2px rgba(24,44,74,.05),0 18px 40px -32px rgba(24,44,74,.30);
    --shadow-float:0 18px 40px -22px rgba(24,44,74,.24);
    /* 段落角色配色 */
    --c-title:#2563eb;
    --c-docorg:#c02a5c;
    --c-recipient:#b0661a;
    --c-h1:#0f7a8c;
    --c-h2:#6b57c8;
    --c-h3:#4a6fa5;
    --c-body:#93a1b1;
    --c-sign:#138a6b;
    --c-blank:#c6d0dc;
    --c-break:#6b57c8;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e141b;
    --surface:#151d27;
    --surface-2:#1a232e;
    --surface-3:#202b38;
    --text:#e4ebf2;
    --muted:#93a2b3;
    --faint:#6d7c8c;
    --border:#243040;
    --border-strong:#314052;
    --accent:#5b9dff;
    --accent-hover:#82b4ff;
    --accent-soft:rgba(91,157,255,.14);
    --ok:#43c39f;
    --warn:#e0a955;
    --bad:#f07a95;
    --overlay:rgba(10,15,20,.76);
    --toast-bg:#e6edf3;
    --toast-text:#101821;
    --shadow-card:0 1px 2px rgba(0,0,0,.30),0 18px 40px -32px rgba(0,0,0,.75);
    --shadow-float:0 18px 40px -22px rgba(0,0,0,.65);
    --c-title:#79a8ff;
    --c-docorg:#f07a9f;
    --c-recipient:#e0a45c;
    --c-h1:#4cc4d4;
    --c-h2:#b4a3ff;
    --c-h3:#93b3de;
    --c-body:#8b99aa;
    --c-sign:#4ec9a0;
    --c-blank:#5a6a7c;
    --c-break:#b4a3ff;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 480px at 50% -12%, var(--accent-soft), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    font-size:14px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    transition:color .2s;
  }
  ::selection{background:var(--accent-soft);color:var(--text)}
  .topbar{
    position:relative;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:16px 32px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:4px 14px;
  }
  .topbar h1{
    margin:0;
    font-size:17px;
    font-weight:700;
    letter-spacing:.3px;
    color:var(--text);
  }
  .topbar h1 span{color:var(--accent)}
  .topbar p{
    margin:0;color:var(--muted);font-size:12.5px;
  }
  .topbar .spacer{flex:1}
  .theme-toggle{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:10px;
    border:1px solid var(--border);background:var(--surface-2);
    color:var(--muted);cursor:pointer;
    transition:border-color .18s,color .18s,background .18s;
  }
  .theme-toggle:hover{
    border-color:var(--accent);color:var(--accent);background:var(--accent-soft);
  }
  .theme-toggle svg{width:18px;height:18px;display:block}
  .theme-toggle .i-sun{display:none}
  :root[data-theme="dark"] .theme-toggle .i-sun{display:block}
  :root[data-theme="dark"] .theme-toggle .i-moon{display:none}

  main{
    max-width:1280px;margin:0 auto;padding:28px 28px 70px;
    display:flex;flex-direction:column;
    min-height:calc(100vh - 61px);
  }

  /* ---------- 上传区 ---------- */
  #drop{
    background:var(--surface);
    border:1.5px dashed var(--border-strong);
    border-radius:20px;
    padding:70px 24px;
    margin:auto 0;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--shadow-card);
    transition:border-color .2s,box-shadow .2s,transform .2s,background .2s;
  }
  #drop:hover,#drop.over{
    border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 4%, var(--surface));
    transform:translateY(-2px);
    box-shadow:var(--shadow-float);
  }
  #drop svg{
    width:64px;height:64px;padding:15px;border-radius:50%;
    stroke:var(--accent);
    background:var(--accent-soft);
  }
  #drop h2{margin:18px 0 8px;font-size:17px;font-weight:600;letter-spacing:.2px}
  #drop p{margin:0;color:var(--muted);font-size:12.5px}
  #drop .hint{
    display:inline-block;margin-top:20px;padding:5px 14px;
    border:1px solid var(--border);
    border-radius:999px;font-size:12px;font-weight:500;color:var(--muted);
    background:var(--surface-2);
  }

  /* ---------- 工作区 ---------- */
  #workspace{display:grid;grid-template-columns:minmax(280px,36%) 1fr;gap:22px;align-items:start}
  @media (max-width:980px){
    #workspace{grid-template-columns:1fr}
    .preview{position:static}
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow-card);
  }
  .preview{position:sticky;top:20px;padding:14px}
  #thumbs img{
    display:block;width:100%;border-radius:10px;margin-bottom:10px;
    border:1px solid var(--border);
    background:var(--surface-2);
  }
  .preview .meta{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 4px 2px;color:var(--muted);font-size:12px;
  }
  #filename{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .editor{display:flex;flex-direction:column;gap:12px}

  .toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    padding:12px 16px;
    background:var(--surface-2);
  }
  .toolbar .grow{flex:1}
  .field{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
  select,input,textarea{font-family:inherit;color:inherit}
  .field select{
    border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);
    padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--text);
    outline:none;cursor:pointer;transition:border-color .15s,box-shadow .15s;
  }
  .field select:hover{border-color:var(--accent)}
  .field select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }

  button{
    font-family:inherit;cursor:pointer;
    transition:background .18s,border-color .18s,color .18s,box-shadow .18s,transform .18s;
    font-size:13px;font-weight:600;
  }
  .btn{
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
    border-radius:8px;padding:7px 14px;
  }
  .btn:hover{
    border-color:var(--accent);color:var(--accent);background:var(--accent-soft);
  }
  .btn.primary{
    background:var(--accent);border:1px solid var(--accent);color:#fff;
    border-radius:8px;padding:8px 24px;font-weight:600;letter-spacing:.2px;
  }
  .btn.primary:hover{
    background:var(--accent-hover);border-color:var(--accent-hover);color:#fff;
    box-shadow:0 10px 22px -14px var(--accent);
  }
  .btn.primary:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
  .ghost{
    border:none;background:transparent;color:var(--muted);
    font-size:12px;padding:2px 8px;border-radius:6px;
  }
  .ghost:hover{color:var(--accent);background:var(--accent-soft)}

  /* ---------- 段落卡片 ---------- */
  .block{
    background:linear-gradient(100deg,color-mix(in srgb,var(--role,var(--c-body)) 6%,var(--surface)) 0%,var(--surface) 42%);
    border:1px solid var(--border);
    border-left:3px solid var(--role,var(--c-body));
    border-radius:12px;
    padding:10px 14px 12px;
    transition:border-color .18s,box-shadow .18s;
    animation:rise .28s ease both;
  }
  .block:focus-within{
    border-color:color-mix(in srgb,var(--role,var(--accent)) 45%,var(--border));
    box-shadow:
      0 0 0 3px color-mix(in srgb,var(--role,var(--accent)) 14%,transparent),
      0 14px 30px -24px rgba(15,30,50,.45);
  }
  .block-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .block-top select{
    appearance:none;-webkit-appearance:none;
    border:none;background:transparent;
    font-size:12px;font-weight:700;
    color:color-mix(in srgb,var(--role,var(--c-body)) 70%,var(--text));
    padding:2px 18px 2px 0;
    cursor:pointer;outline:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='6'><path d='M0 0l4 5 4-5z' fill='%2398a6b6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 2px center;
  }
  .conf{
    font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:color-mix(in srgb,var(--ok) 12%,transparent);
    color:var(--ok);
    font-variant-numeric:tabular-nums;
  }
  .conf.mid{
    background:color-mix(in srgb,var(--warn) 14%,transparent);
    color:var(--warn);
  }
  .conf.low{
    background:color-mix(in srgb,var(--bad) 13%,transparent);
    color:var(--bad);
  }
  .block textarea{
    display:block;width:100%;border:none;outline:none;background:transparent;
    resize:none;overflow:hidden;color:var(--text);
    font-family:"FangSong","仿宋","STFangsong",serif;
    font-size:16px;line-height:1.8;
    padding:2px 0;
  }
  .block textarea::placeholder{color:var(--faint)}
  .block[data-role="title"] textarea{
    font-family:"SimHei","黑体",sans-serif;font-size:19px;font-weight:600;
    text-align:center;
  }
  .block[data-role="docorg"] textarea{
    font-family:"SimHei","黑体",sans-serif;font-size:22px;font-weight:600;
    text-align:center;color:var(--role);
  }
  .block[data-role="heading1"] textarea{font-family:"SimHei","黑体",sans-serif;font-weight:600}
  .block[data-role="heading2"] textarea{font-family:"KaiTi","楷体",serif}
  .block[data-role="signature"] textarea,
  .block[data-role="date"] textarea{text-align:right}
  .block[data-role="pagebreak"]{
    background:var(--surface-2);
    border-style:dashed;border-color:var(--border-strong);
    border-left-style:solid;border-left-width:3px;
    padding:6px 14px;
  }
  .block[data-role="pagebreak"] .block-top{margin:0}

  /* ---------- 状态 ---------- */
  #busy{
    position:fixed;inset:0;background:var(--overlay);
    backdrop-filter:blur(6px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;z-index:50;
  }
  #busy .ring{
    width:46px;height:46px;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0deg,var(--accent) 300deg,var(--accent) 360deg);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #busy p{margin:0;color:var(--muted);font-weight:600;font-size:13px}

  #toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(12px);
    background:var(--toast-bg);color:var(--toast-text);
    padding:10px 22px;border-radius:10px;
    font-size:13px;font-weight:600;
    box-shadow:var(--shadow-float);
    opacity:0;pointer-events:none;transition:.22s;z-index:60;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty{
    text-align:center;color:var(--muted);font-size:12.5px;
    padding:34px 0;
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>公文 OCR <span>·</span> 图片 / PDF 转 Word</h1>
  <p>上传 JPG、PNG（可多选，最多 10 张）或 PDF 扫描件，自动识别并合成一份公文格式（仿宋三号 · 黑体标题）</p>
  <div class="spacer"></div>
  <button class="theme-toggle" id="theme" type="button" aria-label="切换深浅色主题" title="切换深浅色主题">
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z"/>
    </svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
</div>

<main>
  <section id="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V4m0 0L7 9m5-5l5 5"/>
      <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
    </svg>
    <h2>拖拽图片（可多选）或 PDF 到这里，或点击选择文件</h2>
    <p>JPG、PNG 最多 10 张，会自动合成一份 Word；PDF 单独上传，总大小不超过 50MB</p>
    <div class="hint">也可以直接按 Ctrl+V 粘贴截图</div>
    <input id="file" type="file" accept="image/jpeg,image/png,application/pdf,.pdf" multiple hidden>
  </section>

  <section id="workspace" hidden>
    <aside class="card preview">
      <div id="thumbs"></div>
      <div class="meta">
        <span id="filename">—</span>
        <button class="ghost" id="reset">换一份</button>
      </div>
    </aside>

    <div class="editor">
      <div class="card toolbar">
        <div class="field">
          正文
          <select id="bodyFont">
            <option value="仿宋">仿宋</option>
            <option value="仿宋_GB2312">仿宋_GB2312</option>
            <option value="华文仿宋">华文仿宋</option>
          </select>
        </div>
        <div class="field">
          标题
          <select id="titleFont">
            <option value="黑体">黑体</option>
            <option value="方正小标宋简体">方正小标宋简体</option>
            <option value="宋体">宋体</option>
          </select>
        </div>
        <div class="grow"></div>
        <button class="btn" id="add">＋ 新增段落</button>
        <button class="btn primary" id="generate">生成 Word</button>
      </div>
      <div id="blocks" class="editor"></div>
    </div>
  </section>
</main>

<div id="busy" hidden><div class="ring"></div><p id="busyText">正在识别文字…</p></div>
<div id="toast"></div>

<script>
const META = {
  title:     ['标题',        'var(--c-title)'],
  docorg:    ['发文机关标志', 'var(--c-docorg)'],
  recipient: ['主送机关',     'var(--c-recipient)'],
  heading1:  ['一级标题 一、', 'var(--c-h1)'],
  heading2:  ['二级标题 （一）','var(--c-h2)'],
  heading3:  ['三级标题 1.',  'var(--c-h3)'],
  body:      ['正文',        'var(--c-body)'],
  signature: ['发文机关署名', 'var(--c-sign)'],
  date:      ['成文日期',     'var(--c-sign)'],
  blank:     ['空行',        'var(--c-blank)'],
  pagebreak: ['分页符',      'var(--c-break)'],
};

const $ = s => document.querySelector(s);
const drop = $('#drop');
const workspace = $('#workspace');
const listEl = $('#blocks');
const state = { blocks: [], thumbUrls: [], busy: false };

/* ---------- 主题 ---------- */
const themeBtn = $('#theme');
const darkMedia = window.matchMedia('(prefers-color-scheme: dark)');

themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch (e) {}
});

darkMedia.addEventListener('change', e => {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (err) {}
  if (!saved) document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
});

/* ---------- 工具 ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function busy(on, text){
  state.busy = on;
  $('#busyText').textContent = text || '正在识别文字…';
  $('#busy').hidden = !on;
  $('#generate').disabled = on;
}

function autosize(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function options(selected){
  return Object.entries(META)
    .map(([k, [label]]) => `<option value="${k}"${k === selected ? ' selected' : ''}>${label}</option>`)
    .join('');
}

/* ---------- 渲染 ---------- */
function card(b, i){
  const color = (META[b.role] || META.body)[1];
  let conf = '';
  if (typeof b.score === 'number' && b.role !== 'pagebreak'){
    const pct = Math.round(b.score * 100);
    const cls = b.score >= .9 ? '' : b.score >= .75 ? ' mid' : ' low';
    conf = `<span class="conf${cls}" title="识别置信度">${pct}%</span>`;
  }
  const head = `<div class="block-top">
      <select class="role" aria-label="段落类型">${options(b.role)}</select>
      ${conf}
      <span style="flex:1"></span>
      <button class="ghost del" title="删除此段">删除</button>
    </div>`;
  const body = b.role === 'pagebreak'
    ? ''
    : `<textarea rows="1" placeholder="输入文字…">${esc(b.text)}</textarea>`;
  return `<article class="block" data-i="${i}" data-role="${b.role}" style="--role:${color}">
    ${head}${body}
  </article>`;
}

function render(){
  listEl.innerHTML = state.blocks.length
    ? state.blocks.map(card).join('')
    : '<div class="empty">还没有内容，点击「新增段落」开始编辑</div>';
  listEl.querySelectorAll('textarea').forEach(autosize);
}

/* ---------- 上传与识别 ---------- */
const isPdf = file => file.type === 'application/pdf' || /\.pdf$/i.test(file.name);

function setThumbs(srcs){
  $('#thumbs').innerHTML = srcs
    .map(src => `<img src="${src}" alt="页面预览">`)
    .join('');
}

function clearThumbs(){
  state.thumbUrls.forEach(u => URL.revokeObjectURL(u));
  state.thumbUrls = [];
  $('#thumbs').innerHTML = '';
}

const MAX_FILES = 10;

async function handleFiles(list){
  const files = [...list];
  if (!files.length || state.busy) return;

  const pdfs = files.filter(isPdf);
  if (files.length > MAX_FILES){
    toast(`一次最多上传 ${MAX_FILES} 张图片`);
    return;
  }
  if (pdfs.length && files.length > 1){
    toast('PDF 请单独上传，图片可以多选');
    return;
  }
  if (!pdfs.length && files.some(f => !/^image\/(jpeg|png)$/.test(f.type))){
    toast('请上传 JPG、PNG 或 PDF 文件');
    return;
  }
  if (files.reduce((s, f) => s + f.size, 0) > 50 * 1024 * 1024){
    toast('文件总大小超过 50MB，请压缩后再试');
    return;
  }

  const pdf = pdfs.length === 1;
  clearThumbs();
  if (!pdf){
    state.thumbUrls = files.map(f => URL.createObjectURL(f));
    setThumbs(state.thumbUrls);
  }
  $('#filename').textContent = pdf
    ? files[0].name
    : files.length === 1 ? files[0].name : `${files.length} 张图片`;

  busy(true, pdf ? '正在解析 PDF，逐页识别中…'
    : files.length > 1 ? `正在依次识别 ${files.length} 张图片…` : '正在识别文字…');
  try{
    const fd = new FormData();
    files.forEach(f => fd.append('files', f));
    const res = await fetch('/api/ocr', { method: 'POST', body: fd });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || '识别失败');

    state.blocks = data.blocks || [];
    if (!state.blocks.length) throw new Error('未识别到文字，请换更清晰的文件');

    if (pdf){
      setThumbs(data.previews || []);
      $('#filename').textContent = `${
        files[0].name} · 共 ${data.pages} 页${data.previews?.length < data.pages ? '（仅显示前几页）' : ''}`;
    }else if (files.length > 1){
      $('#filename').textContent = `${files[0].name} 等 ${files.length} 张 · 共 ${data.pages} 页`;
    }

    drop.hidden = true;
    workspace.hidden = false;
    render();
  }catch(err){
    clearThumbs();
    toast(err.message || '识别失败');
  }finally{
    busy(false);
  }
}

drop.addEventListener('click', () => $('#file').click());
$('#file').addEventListener('click', e => e.stopPropagation());
$('#file').addEventListener('change', e => {
  handleFiles(e.target.files);
  e.target.value = '';
});

['dragenter', 'dragover'].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); })
);
['dragleave', 'drop'].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); })
);
drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) handleFiles(files);
});

/* ---------- 编辑 ---------- */
listEl.addEventListener('input', e => {
  if (e.target.tagName !== 'TEXTAREA') return;
  const i = +e.target.closest('.block').dataset.i;
  state.blocks[i].text = e.target.value;
  autosize(e.target);
});

listEl.addEventListener('change', e => {
  if (!e.target.classList.contains('role')) return;
  const i = +e.target.closest('.block').dataset.i;
  state.blocks[i].role = e.target.value;
  render();
});

listEl.addEventListener('click', e => {
  if (!e.target.classList.contains('del')) return;
  const i = +e.target.closest('.block').dataset.i;
  state.blocks.splice(i, 1);
  render();
});

$('#add').addEventListener('click', () => {
  state.blocks.push({ role: 'body', text: '' });
  render();
  const areas = listEl.querySelectorAll('textarea');
  areas[areas.length - 1]?.focus();
});

$('#reset').addEventListener('click', () => {
  clearThumbs();
  state.blocks = [];
  workspace.hidden = true;
  drop.hidden = false;
});

/* ---------- 导出 ---------- */
$('#generate').addEventListener('click', async () => {
  const blocks = state.blocks
    .filter(b => b.role === 'blank' || b.role === 'pagebreak' || b.text.trim())
    .map(b => ({ role: b.role, text: b.text.trim() }));
  if (!blocks.length){
    toast('没有可导出的内容');
    return;
  }

  busy(true, '正在生成 Word…');
  try{
    const res = await fetch('/api/docx', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        blocks,
        body_font: $('#bodyFont').value,
        title_font: $('#titleFont').value,
      }),
    });
    if (!res.ok){
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || '生成失败');
    }

    const blob = await res.blob();
    const cd = res.headers.get('Content-Disposition') || '';
    const m = /filename\*=UTF-8''([^;]+)/i.exec(cd);
    const name = m ? decodeURIComponent(m[1]) : '公文.docx';

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('已生成：' + name);
  }catch(err){
    toast(err.message || '生成失败');
  }finally{
    busy(false);
  }
});
</script>
</body>
</html>
